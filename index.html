<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Surprise! 🎉</title>
  
  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31103f 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 15px;
      overflow-x: hidden;
    }

    /* Main Card Container */
    .card {
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 10;
    }

    .title {
      font-family: 'Fredoka One', cursive;
      font-size: 2.5rem;
      background: linear-gradient(45deg, #ffee00, #ff3366, #7000ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .name {
      color: #ffee00;
      text-transform: capitalize;
    }

    .wish-text {
      font-size: 1rem;
      line-height: 1.6;
      color: #e2e8f0;
      margin: 15px 0 20px 0;
    }

    /* Interactive Cake */
    .cake-box {
      margin: 20px auto;
      cursor: pointer;
      user-select: none;
      display: inline-block;
    }

    .cake-emoji {
      font-size: 6rem;
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .cake-box:hover .cake-emoji {
      transform: scale(1.1) rotate(4deg);
    }

    .tap-hint {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #ffee00;
      font-weight: 600;
      margin-top: 10px;
      border: 1px solid rgba(255, 238, 0, 0.3);
    }

    /* Music Play Indicator */
    .status-text {
      font-size: 0.85rem;
      color: #10b981;
      margin-top: 10px;
      display: none;
      font-weight: 600;
    }

    /* Sender Form Section */
    .sender-section {
      margin-top: 25px;
      border-top: 1px dashed rgba(255, 255, 255, 0.2);
      padding-top: 20px;
      text-align: left;
    }

    .toggle-sender-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      display: block;
      margin: 0 auto;
    }

    .toggle-sender-btn:hover { color: #fff; }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      transition: transform 0.1s;
    }

    .btn:active { transform: scale(0.98); }
    .btn-create { background: #ff3366; color: white; }
    .btn-wa { background: #25D366; color: white; }

    /* Hidden Offscreen YouTube Player Container (Required for Mobile Audio) */
    #yt-hidden-container {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 200px;
      height: 200px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Hidden YouTube Player Container -->
  <div id="yt-hidden-container">
    <div id="yt-player"></div>
  </div>

  <div class="card">
    <h1 class="title">Happy Birthday, <br><span class="name" id="displayName">Birthday Star</span>! 🎉</h1>

    <p class="wish-text" id="displayWish">
      Wishing you a magical day filled with laughter, happiness, love, and all your heart desires!
    </p>

    <!-- Tap Cake Trigger -->
    <div class="cake-box" onclick="onCakeClick()">
      <div class="cake-emoji" id="cakeEmoji">🎂</div>
      <br>
      <span class="tap-hint" id="cakeHint">👇 Tap cake to blow candles & play song!</span>
    </div>

    <div class="status-text" id="statusText">🎶 Playing your birthday music track...</div>

    <!-- Creator / Sender Controls -->
    <button class="toggle-sender-btn" id="toggleFormBtn" onclick="toggleSenderForm()">
      🎁 Want to create & send a surprise link? Click here
    </button>

    <div class="sender-section" id="senderForm" style="display: none;">
      <h3 style="font-size: 1rem; color: #ffee00; margin-bottom: 12px; text-align: center;">Customize Surprise Link</h3>
      
      <div class="form-group">
        <label>Birthday Person's Name:</label>
        <input type="text" id="inputName" placeholder="e.g. Rahul, Sarah">
      </div>

      <div class="form-group">
        <label>Wish Message:</label>
        <textarea id="inputWish" rows="2" placeholder="Write your personalized birthday message..."></textarea>
      </div>

      <div class="form-group">
        <label>YouTube Video Link (Song/Music):</label>
        <input type="url" id="inputYtUrl" placeholder="https://www.youtube.com/watch?v=...">
      </div>

      <button class="btn btn-create" onclick="generateAndCopyLink()">
        <i class="fa-solid fa-copy"></i> Copy Custom Share Link
      </button>
      
      <button class="btn btn-wa" onclick="shareToWhatsApp()">
        <i class="fa-brands fa-whatsapp"></i> Share Directly on WhatsApp
      </button>
    </div>

  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let ytPlayer = null;
    let isYTReady = false;
    let targetVideoId = '';
    let isPlaying = false;

    // Helper: Extract 11-character YouTube Video ID from any link format
    function parseYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // Called automatically by YouTube IFrame API when script loads
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '200',
        width: '200',
        videoId: '',
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'disablekb': 1,
          'enablejsapi': 1
        },
        events: {
          'onReady': () => {
            isYTReady = true;
            if (targetVideoId) {
              ytPlayer.cueVideoById(targetVideoId);
            }
          },
          'onError': (e) => {
            console.warn("YouTube Player error:", e.data);
            alert("Note: This YouTube video cannot be played because embedding was disabled by its publisher. Try another video!");
          }
        }
      });
    }

    // Load URL parameters on startup
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name');
      const wish = params.get('wish');
      const yt = params.get('yt');

      if (name) {
        document.getElementById('displayName').innerText = name;
        document.getElementById('inputName').value = name;
      }

      if (wish) {
        document.getElementById('displayWish').innerText = wish;
        document.getElementById('inputWish').value = wish;
      }

      if (yt) {
        targetVideoId = parseYouTubeId(yt) || yt;
        document.getElementById('inputYtUrl').value = `https://www.youtube.com/watch?v=${targetVideoId}`;
      } else {
        // Default mode: Open sender form automatically if no custom params exist
        document.getElementById('senderForm').style.display = 'block';
        document.getElementById('toggleFormBtn').style.display = 'none';
      }
    });

    // Handle Cake Tap / Candle Blow
    function onCakeClick() {
      // 1. Trigger Confetti
      if (typeof confetti === 'function') {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }

      // 2. Update UI
      document.getElementById('cakeEmoji').innerText = '🍰';
      document.getElementById('cakeHint').innerText = '✨ Wish Granted! Candle blown out!';

      // 3. Play YouTube Music
      if (targetVideoId && isYTReady && ytPlayer) {
        if (typeof ytPlayer.playVideo === 'function') {
          ytPlayer.loadVideoById(targetVideoId);
          ytPlayer.playVideo();
          isPlaying = true;
          document.getElementById('statusText').style.display = 'block';
        }
      } else if (!targetVideoId) {
        alert("No YouTube song configured! Fill in the YouTube link below to add a song.");
        document.getElementById('senderForm').style.display = 'block';
      }
    }

    // Toggle Sender Inputs
    function toggleSenderForm() {
      const form = document.getElementById('senderForm');
      form.style.display = (form.style.display === 'none') ? 'block' : 'none';
    }

    // Build the shareable URL
    function buildShareUrl() {
      const name = document.getElementById('inputName').value.trim() || 'Friend';
      const wish = document.getElementById('inputWish').value.trim() || 'Happy Birthday!';
      const rawYtUrl = document.getElementById('inputYtUrl').value.trim();
      const ytId = parseYouTubeId(rawYtUrl);

      if (!ytId) {
        alert("Please paste a valid YouTube link (e.g. https://www.youtube.com/watch?v=...)");
        return null;
      }

      const baseUrl = window.location.origin + window.location.pathname;
      return `${baseUrl}?name=${encodeURIComponent(name)}&wish=${encodeURIComponent(wish)}&yt=${encodeURIComponent(ytId)}`;
    }

    function generateAndCopyLink() {
      const shareUrl = buildShareUrl();
      if (shareUrl) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          alert("Surprise Link copied to clipboard! Send it to the birthday person.");
        }).catch(() => {
          prompt("Copy this link manually:", shareUrl);
        });
      }
    }

    function shareToWhatsApp() {
      const shareUrl = buildShareUrl();
      if (shareUrl) {
        const name = document.getElementById('inputName').value.trim() || 'Friend';
        const text = `🤫 Shhh... ${name}, someone sent you a secret birthday surprise!\n\nTap the link below to blow your candles & hear your song: 👇\n${shareUrl}`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
      }
    }
  </script>
</body>
</html>
