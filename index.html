<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! 🎉</title>

  <!-- Confetti and Icons -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Minimal Floating Background Accent */
    .bg-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #ff3366, #7000ff);
      filter: blur(120px);
      opacity: 0.25;
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }

    /* Minimal Gear Button */
    .settings-gear-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 20;
    }

    .settings-gear-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      transform: rotate(45deg);
    }

    /* Main Refined Card */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 48px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
    }

    /* Floating Cake Emoji */
    .cake-wrapper {
      display: inline-block;
      margin-bottom: 24px;
      cursor: pointer;
      animation: float 4s ease-in-out infinite;
    }

    .cake {
      font-size: 5rem;
      user-select: none;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cake-wrapper:hover .cake {
      transform: scale(1.15) rotate(6deg);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .subtitle {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 0.75rem;
      font-weight: 800;
      color: #ff3366;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .highlight-name {
      background: linear-gradient(135deg, #ffd166, #ff3366);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .wish {
      font-size: 0.98rem;
      line-height: 1.6;
      color: #94a3b8;
      font-weight: 400;
    }

    /* Minimal Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 28px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
    }

    .close-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-btn:hover { color: #ffffff; }

    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      color: #64748b;
      font-weight: 700;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border 0.2s;
    }

    input:focus, textarea:focus {
      border-color: #ff3366;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ff3366;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .btn.wa {
      background: #25d366;
      margin-bottom: 0;
    }

    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- Minimal Settings Button -->
  <button class="settings-gear-btn" onclick="openModal()" title="Settings">
    <i class="fa-solid fa-sliders"></i>
  </button>

  <!-- Card Display -->
  <div class="card">
    <div class="cake-wrapper" onclick="triggerConfetti()">
      <div class="cake">🎂</div>
    </div>
    
    <div class="subtitle">Happy Birthday</div>
    <h1><span class="highlight-name" id="displayName">Alex</span> 🎉</h1>
    
    <p class="wish" id="displayWish">Wishing you a wonderful day filled with happiness, laughter, and great memories!</p>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Customize Card</h3>
        <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <label for="inputName">Name</label>
      <input type="text" id="inputName" placeholder="Enter name">

      <label for="inputWish">Message</label>
      <textarea id="inputWish" rows="3" placeholder="Enter custom message"></textarea>

      <button class="btn" onclick="copyCustomLink()">
        <i class="fa-solid fa-link"></i> Copy Link
      </button>

      <button class="btn wa" onclick="shareWhatsApp()">
        <i class="fa-brands fa-whatsapp"></i> WhatsApp
      </button>
    </div>
  </div>

  <script>
    // Read URL params on start
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name') || 'Alex';
      const wish = params.get('wish') || 'Wishing you a wonderful day filled with happiness, laughter, and great memories!';

      document.getElementById('displayName').innerText = name;
      document.getElementById('displayWish').innerText = wish;

      document.getElementById('inputName').value = name;
      document.getElementById('inputWish').value = wish;
    });

    function openModal() {
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    window.onclick = function(e) {
      if (e.target === document.getElementById('settingsModal')) {
        closeModal();
      }
    };

    function getShareUrl() {
      const name = document.getElementById('inputName').value.trim() || 'Friend';
      const wish = document.getElementById('inputWish').value.trim() || 'Happy Birthday!';

      document.getElementById('displayName').innerText = name;
      document.getElementById('displayWish').innerText = wish;

      const baseUrl = window.location.origin + window.location.pathname;
      return `${baseUrl}?name=${encodeURIComponent(name)}&wish=${encodeURIComponent(wish)}`;
    }

    function copyCustomLink() {
      const link = getShareUrl();
      navigator.clipboard.writeText(link).then(() => {
        alert('Copied link to clipboard!');
        closeModal();
      }).catch(() => {
        prompt('Copy this link:', link);
      });
    }

    function shareWhatsApp() {
      const link = getShareUrl();
      const name = document.getElementById('inputName').value.trim() || 'Friend';
      const text = `🎉 Happy Birthday ${name}! View your card here:\n${link}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
      closeModal();
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 70,
          spread: 60,
          origin: { y: 0.6 }
        });
      }
    }
  </script>
</body>
</html>
