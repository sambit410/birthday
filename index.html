<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Celebration 🎉</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      background: #0f172a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .cake {
      font-size: 5rem;
      cursor: pointer;
      user-select: none;
      margin: 20px 0;
      transition: transform 0.2s;
    }
    .cake:hover { transform: scale(1.1); }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #ff3366;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    /* Hidden Offscreen YouTube Player Container */
    #yt-hidden-player {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 200px;
      height: 200px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Offscreen YouTube Player Container -->
  <div id="yt-hidden-player"><div id="yt-player"></div></div>

  <div class="card">
    <h1 id="title">Happy Birthday! 🎉</h1>
    
    <div class="cake" onclick="handleCakeClick()">🎂</div>
    <p>Tap cake to blow candles & play music!</p>

    <div style="margin-top: 20px; text-align: left;">
      <label>Paste YouTube Link:</label>
      <input type="text" id="ytUrlInput" placeholder="https://www.youtube.com/watch?v=...">
      <button onclick="saveAndLoadYouTube()">Save & Load Track</button>
    </div>
  </div>

  <script>
    let ytPlayer = null;
    let isYTReady = false;
    let currentVideoId = '';

    // Advanced YouTube Video ID Extractor
    function extractYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // Initialize YouTube IFrame API
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '200',
        width: '200',
        videoId: '',
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'disablekb': 1,
          'enablejsapi': 1
        },
        events: {
          'onReady': () => { isYTReady = true; },
          'onError': (e) => {
            console.warn("YouTube Player Error (Video may disable embedding):", e.data);
            alert("This video cannot be played because embedding is disabled by the creator.");
          }
        }
      });
    }

    function saveAndLoadYouTube() {
      const url = document.getElementById('ytUrlInput').value.trim();
      const videoId = extractYouTubeId(url);

      if (!videoId) {
        alert("Invalid YouTube Link. Please paste a valid YouTube video or shorts URL.");
        return;
      }

      currentVideoId = videoId;
      localStorage.setItem('saved_yt_id', videoId);

      if (isYTReady && ytPlayer && typeof ytPlayer.cueVideoById === 'function') {
        ytPlayer.cueVideoById(videoId);
        alert("YouTube Track Loaded! Tap the cake to play.");
      }
    }

    function handleCakeClick() {
      // Trigger Confetti
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

      // Play YouTube Music
      if (currentVideoId && isYTReady && ytPlayer) {
        if (typeof ytPlayer.playVideo === 'function') {
          ytPlayer.loadVideoById(currentVideoId);
          ytPlayer.playVideo();
        }
      } else if (!currentVideoId) {
        alert("Please paste a YouTube link first!");
      }
    }

    // Auto-load saved video ID on start
    window.addEventListener('DOMContentLoaded', () => {
      const savedId = localStorage.getItem('saved_yt_id');
      if (savedId) {
        currentVideoId = savedId;
      }
    });
  </script>

  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
