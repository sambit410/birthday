<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! 🎉</title>

  <!-- Confetti and Icon Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    /* Settings Gear Button */
    .settings-gear-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      z-index: 20;
    }

    .settings-gear-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(45deg);
    }

    /* Main Wish Card */
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .cake {
      font-size: 5.5rem;
      cursor: pointer;
      user-select: none;
      margin-bottom: 20px;
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .cake:hover {
      transform: scale(1.1);
    }

    h1 {
      font-size: 2.2rem;
      color: #ffee00;
      margin-bottom: 15px;
      line-height: 1.3;
    }

    .wish {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #e2e8f0;
    }

    /* Modal Overlay & Popup */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 25px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    .modal-header h3 {
      font-size: 1.1rem;
      color: #ffee00;
    }

    .close-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #fff;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: #cbd5e1;
      font-weight: 600;
      text-align: left;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ff3366;
      color: #fff;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn.wa {
      background: #25D366;
      margin-bottom: 0;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- Top Settings Button -->
  <button class="settings-gear-btn" onclick="openModal()" title="Customize Menu">
    <i class="fa-solid fa-gear"></i>
  </button>

  <!-- Main Birthday Card -->
  <div class="card">
    <div class="cake" onclick="triggerConfetti()" title="Click to pop confetti!">🎂</div>
    <h1>Happy Birthday, <br><span id="displayName">Alex</span>! 🎉</h1>
    <p class="wish" id="displayWish">Wishing you a fantastic day filled with joy, laughter, and happiness!</p>
  </div>

  <!-- Settings Modal Popup -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ Wish Settings</h3>
        <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <label for="inputName">Birthday Person's Name:</label>
      <input type="text" id="inputName" placeholder="Enter name">

      <label for="inputWish">Wish Message:</label>
      <textarea id="inputWish" rows="3" placeholder="Enter custom wish message"></textarea>

      <button class="btn" onclick="copyCustomLink()">
        <i class="fa-solid fa-copy"></i> Copy Share Link
      </button>

      <button class="btn wa" onclick="shareWhatsApp()">
        <i class="fa-brands fa-whatsapp"></i> Share on WhatsApp
      </button>
    </div>
  </div>

  <script>
    // Load URL parameters on startup
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name') || 'Alex';
      const wish = params.get('wish') || 'Wishing you a fantastic day filled with joy, laughter, and happiness!';

      document.getElementById('displayName').innerText = name;
      document.getElementById('displayWish').innerText = wish;

      document.getElementById('inputName').value = name;
      document.getElementById('inputWish').value = wish;
    });

    // Modal Control Functions
    function openModal() {
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    // Close modal if user clicks outside the modal box
    window.onclick = function(event) {
      const modal = document.getElementById('settingsModal');
      if (event.target === modal) {
        closeModal();
      }
    };

    // Helper: Build the shareable URL & update display live
    function getShareUrl() {
      const name = document.getElementById('inputName').value.trim() || 'Friend';
      const wish = document.getElementById('inputWish').value.trim() || 'Happy Birthday!';

      document.getElementById('displayName').innerText = name;
      document.getElementById('displayWish').innerText = wish;

      const baseUrl = window.location.origin + window.location.pathname;
      return `${baseUrl}?name=${encodeURIComponent(name)}&wish=${encodeURIComponent(wish)}`;
    }

    function copyCustomLink() {
      const link = getShareUrl();
      navigator.clipboard.writeText(link).then(() => {
        alert('Custom link copied! Send it to the birthday person.');
        closeModal();
      }).catch(() => {
        prompt('Copy this link:', link);
      });
    }

    function shareWhatsApp() {
      const link = getShareUrl();
      const name = document.getElementById('inputName').value.trim() || 'Friend';
      const text = `🎉 Happy Birthday ${name}! Open your birthday card here: 👇\n${link}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
      closeModal();
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
      }
    }
  </script>
</body>
</html>
