<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! 🎉</title>

  <!-- Confetti, Icons & Fonts -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Minimal Floating Background Accent */
    .bg-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #ff3366, #7000ff);
      filter: blur(120px);
      opacity: 0.25;
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }

    /* Falling Birthday Rain Elements Container */
    #rain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .falling-item {
      position: absolute;
      top: -50px;
      font-size: 1.8rem;
      user-select: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.2;
      }
    }

    /* Articulated Dancing Toys Layout */
    .toy-dancer {
      position: absolute;
      bottom: 20px;
      width: 90px;
      height: 150px;
      display: none;
      z-index: 12;
      user-select: none;
    }

    .toy-dancer.left {
      left: 10%;
      animation: bodyBounceLeft 0.8s ease-in-out infinite alternate;
    }

    .toy-dancer.right {
      right: 10%;
      animation: bodyBounceRight 0.8s ease-in-out infinite alternate;
    }

    /* Party Hat */
    .toy-hat {
      position: absolute;
      top: -22px;
      left: 28px;
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 28px solid #ff3366;
      transform-origin: bottom center;
    }
    .left .toy-hat { border-bottom-color: #ff3366; animation: hatTiltLeft 0.8s ease-in-out infinite alternate; }
    .right .toy-hat { border-bottom-color: #ffd166; animation: hatTiltRight 0.8s ease-in-out infinite alternate; }

    .toy-hat::after {
      content: '';
      position: absolute;
      top: -6px;
      left: -4px;
      width: 8px;
      height: 8px;
      background: #ffffff;
      border-radius: 50%;
    }

    /* Head */
    .toy-head {
      position: absolute;
      top: 0;
      left: 22px;
      width: 46px;
      height: 46px;
      background: #fcd34d;
      border-radius: 50%;
      box-shadow: inset -4px -4px 0px rgba(0,0,0,0.1);
    }
    .right .toy-head { background: #fca5a5; }

    /* Eyes & Smile */
    .toy-face {
      position: absolute;
      top: 14px;
      left: 10px;
      width: 26px;
      height: 16px;
    }
    .eye {
      position: absolute;
      width: 5px;
      height: 7px;
      background: #1e1b4b;
      border-radius: 50%;
      top: 2px;
      animation: blink 3s infinite;
    }
    .eye.left-eye { left: 3px; }
    .eye.right-eye { right: 3px; }

    .smile {
      position: absolute;
      bottom: 2px;
      left: 7px;
      width: 12px;
      height: 6px;
      border-bottom: 2px solid #1e1b4b;
      border-radius: 0 0 10px 10px;
    }

    @keyframes blink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }

    /* Torso / Birthday Costume Body */
    .toy-body {
      position: absolute;
      top: 45px;
      left: 25px;
      width: 40px;
      height: 50px;
      background: #3b82f6;
      border-radius: 12px 12px 6px 6px;
    }
    .right .toy-body { background: #ec4899; }

    /* Moving Arms (Hands & Joints) */
    .toy-arm {
      position: absolute;
      top: 48px;
      width: 12px;
      height: 38px;
      background: #fcd34d;
      border-radius: 6px;
      transform-origin: top center;
    }
    .right .toy-arm { background: #fca5a5; }

    .toy-arm.left-arm {
      left: 14px;
      animation: moveArmLeft 0.8s ease-in-out infinite alternate;
    }
    .toy-arm.right-arm {
      right: 14px;
      animation: moveArmRight 0.8s ease-in-out infinite alternate;
    }

    /* Moving Legs (Feet & Steps) */
    .toy-leg {
      position: absolute;
      top: 93px;
      width: 12px;
      height: 42px;
      background: #1e293b;
      border-radius: 6px;
      transform-origin: top center;
    }

    .toy-leg.left-leg {
      left: 28px;
      animation: moveLegLeft 0.8s ease-in-out infinite alternate;
    }
    .toy-leg.right-leg {
      right: 28px;
      animation: moveLegRight 0.8s ease-in-out infinite alternate;
    }

    /* Dance Choreography Keyframes */
    @keyframes bodyBounceLeft {
      0% { transform: translateY(0) rotate(-5deg); }
      100% { transform: translateY(-20px) rotate(5deg); }
    }
    @keyframes bodyBounceRight {
      0% { transform: translateY(0) rotate(5deg); }
      100% { transform: translateY(-20px) rotate(-5deg); }
    }

    @keyframes hatTiltLeft {
      0% { transform: rotate(-10deg) skewX(-5deg); }
      100% { transform: rotate(15deg) skewX(5deg); }
    }
    @keyframes hatTiltRight {
      0% { transform: rotate(10deg) skewX(5deg); }
      100% { transform: rotate(-15deg) skewX(-5deg); }
    }

    @keyframes moveArmLeft {
      0% { transform: rotate(-45deg); }
      100% { transform: rotate(65deg); }
    }
    @keyframes moveArmRight {
      0% { transform: rotate(45deg); }
      100% { transform: rotate(-65deg); }
    }

    @keyframes moveLegLeft {
      0% { transform: rotate(25deg) translateY(0); }
      100% { transform: rotate(-35deg) translateY(-5px); }
    }
    @keyframes moveLegRight {
      0% { transform: rotate(-25deg) translateY(-5px); }
      100% { transform: rotate(35deg) translateY(0); }
    }

    /* Minimal Settings Button */
    .settings-gear-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 20;
    }

    .settings-gear-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      transform: rotate(45deg);
    }

    /* Main Refined Card */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
    }

    /* Floating Cake Emoji */
    .cake-wrapper {
      display: inline-block;
      margin-bottom: 15px;
      cursor: pointer;
      animation: float 4s ease-in-out infinite;
    }

    .cake {
      font-size: 4.5rem;
      user-select: none;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cake-wrapper:hover .cake {
      transform: scale(1.15) rotate(6deg);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .tap-hint {
      display: block;
      font-size: 0.75rem;
      color: #ff3366;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .subtitle {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 0.75rem;
      font-weight: 800;
      color: #ff3366;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .highlight-name {
      background: linear-gradient(135deg, #ffd166, #ff3366);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .wish {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #94a3b8;
      font-weight: 400;
      margin-bottom: 20px;
    }

    /* Visible YouTube Mini Player Wrapper */
    .player-section {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #yt-player {
      width: 100px;
      height: 60px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: #000;
    }

    .player-info {
      text-align: left;
      font-size: 0.8rem;
      color: #cbd5e1;
      overflow: hidden;
    }

    .player-info strong {
      display: block;
      color: #fff;
      font-size: 0.85rem;
      margin-bottom: 2px;
    }

    /* Minimal Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 28px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
    }

    .close-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-btn:hover { color: #ffffff; }

    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      color: #64748b;
      font-weight: 700;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border 0.2s;
    }

    input:focus, textarea:focus {
      border-color: #ff3366;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ff3366;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .btn.wa {
      background: #25d366;
      margin-bottom: 0;
    }

    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="bg-glow"></div>
  <div id="rain-container"></div>

  <!-- Left Toy Dancer (Boy in Party Costume) -->
  <div class="toy-dancer left" id="leftToy">
    <div class="toy-hat"></div>
    <div class="toy-head">
      <div class="toy-face">
        <div class="eye left-eye"></div>
        <div class="eye right-eye"></div>
        <div class="smile"></div>
      </div>
    </div>
    <div class="toy-body"></div>
    <div class="toy-arm left-arm"></div>
    <div class="toy-arm right-arm"></div>
    <div class="toy-leg left-leg"></div>
    <div class="toy-leg right-leg"></div>
  </div>

  <!-- Right Toy Dancer (Girl in Party Costume) -->
  <div class="toy-dancer right" id="rightToy">
    <div class="toy-hat"></div>
    <div class="toy-head">
      <div class="toy-face">
        <div class="eye left-eye"></div>
        <div class="eye right-eye"></div>
        <div class="smile"></div>
      </div>
    </div>
    <div class="toy-body"></div>
    <div class="toy-arm left-arm"></div>
    <div class="toy-arm right-arm"></div>
    <div class="toy-leg left-leg"></div>
    <div class="toy-leg right-leg"></div>
  </div>

  <!-- Minimal Settings Button -->
  <button class="settings-gear-btn" onclick="openModal()" title="Settings">
    <i class="fa-solid fa-sliders"></i>
  </button>

  <!-- Card Display -->
  <div class="card">
    <div class="cake-wrapper" onclick="onCakeClick()">
      <div class="cake" id="cakeEmoji">🎂</div>
    </div>
    
    <span class="tap-hint" id="tapHint">👇 Tap cake to start music & toy dance</span>

    <div class="subtitle">Happy Birthday</div>
    <h1><span class="highlight-name" id="displayName">Alex</span> 🎉</h1>
    
    <p class="wish" id="displayWish">Wishing you a wonderful day filled with happiness, laughter, and great memories!</p>

    <!-- Visible Mini Player Box -->
    <div class="player-section">
      <div id="yt-player"></div>
      <div class="player-info">
        <strong>Birthday Track</strong>
        <span id="playerStatusText">Tap cake to play audio</span>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Customize Card</h3>
        <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <label for="inputName">Name</label>
      <input type="text" id="inputName" placeholder="Enter name">

      <label for="inputWish">Message</label>
      <textarea id="inputWish" rows="2" placeholder="Enter custom message"></textarea>

      <label for="inputYtUrl">YouTube Music Link</label>
      <input type="url" id="inputYtUrl" placeholder="https://www.youtube.com/watch?v=...">

      <button class="btn" onclick="copyCustomLink()">
        <i class="fa-solid fa-link"></i> Copy Share Link
      </button>

      <button class="btn wa" onclick="shareWhatsApp()">
        <i class="fa-brands fa-whatsapp"></i> Share on WhatsApp
      </button>
    </div>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let ytPlayer = null;
    let isYTReady = false;
    let targetVideoId = 'kJQP7kiw5Fk'; // Default upbeat celebratory track if none provided
    let rainInterval = null;

    const birthdayItems = ['🎈', '🎂', '🎁', '🎉', '✨', '🥳', '🧁', '⭐'];

    function startPartyEffects() {
      // Show animated articulated toys
      document.getElementById('leftToy').style.display = 'block';
      document.getElementById('rightToy').style.display = 'block';

      if (rainInterval) return;
      const rainContainer = document.getElementById('rain-container');
      
      rainInterval = setInterval(() => {
        const item = document.createElement('div');
        item.classList.add('falling-item');
        item.innerText = birthdayItems[Math.floor(Math.random() * birthdayItems.length)];
        
        const startLeft = Math.random() * 100;
        const duration = 3 + Math.random() * 3;
        const fontSize = 1.2 + Math.random() * 1.2;

        item.style.left = startLeft + 'vw';
        item.style.animationDuration = duration + 's';
        item.style.fontSize = fontSize + 'rem';

        rainContainer.appendChild(item);

        setTimeout(() => {
          item.remove();
        }, duration * 1000);
      }, 300);
    }

    function parseYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '60',
        width: '100',
        videoId: targetVideoId,
        playerVars: { 'autoplay': 0, 'controls': 1, 'enablejsapi': 1, 'modestbranding': 1 },
        events: {
          'onReady': (e) => {
            isYTReady = true;
            e.target.setVolume(100);
          },
          'onStateChange': (e) => {
            if (e.data === YT.PlayerState.PLAYING) {
              document.getElementById('playerStatusText').innerText = '🎵 Playing audio & dancing!';
            }
          }
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name') || 'Alex';
      const wish = params.get('wish') || 'Wishing you a wonderful day filled with happiness, laughter, and great memories!';
      const yt = params.get('yt');

      document.getElementById('displayName').innerText = name;
      document.getElementById('displayWish').innerText = wish;

      document.getElementById('inputName').value = name;
      document.getElementById('inputWish').value = wish;

      if (yt) {
        targetVideoId = parseYouTubeId(yt) || yt;
        document.getElementById('inputYtUrl').value = `https://www.youtube.com/watch?v=${targetVideoId}`;
      } else {
        document.getElementById('inputYtUrl').value = `https://www.youtube.com/watch?v=${targetVideoId}`;
      }
    });

    function onCakeClick() {
      if (typeof confetti === 'function') {
        confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
      }

      startPartyEffects();

      if (isYTReady && ytPlayer) {
        if (typeof ytPlayer.playVideo === 'function') {
          ytPlayer.loadVideoById(targetVideoId);
          ytPlayer.playVideo();
          document.getElementById('tapHint').style.display = 'none';
        }
      }
    }

    function openModal() {
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    window.onclick = function(e) {
      if (e.target === document.getElementById('settingsModal')) {
        closeModal();
      }
    };

    function getShareUrl() {
      const name = document.getElementById('inputName').value.trim() || 'Friend';
      const wish = document.getElementById('inputWish').value.trim() || 'Happy Birthday!';
      const rawYtUrl = document.getElementById('inputYtUrl').value.trim();
      const ytId = parseYouTubeId(rawYtUrl) || targetVideoId;

      document.getElementById('displayName').innerText = name;
      document.getElementById('displayWish').innerText = wish;

      const baseUrl = window.location.origin + window.location.pathname;
      let url = `${baseUrl}?name=${encodeURIComponent(name)}&wish=${encodeURIComponent(wish)}`;
      if (ytId) {
        url += `&yt=${encodeURIComponent(ytId)}`;
        targetVideoId = ytId;
      }
      return url;
    }

    function copyCustomLink() {
      const link = getShareUrl();
      navigator.clipboard.writeText(link).then(() => {
        alert('Custom link copied! Send it to the birthday person.');
        closeModal();
      }).catch(() => {
        prompt('Copy this link:', link);
      });
    }

    function shareWhatsApp() {
      const link = getShareUrl();
      const name = document.getElementById('inputName').value.trim() || 'Friend';
      const text = `🎉 Happy Birthday ${name}! View your birthday card & toy dance performance here:\n${link}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
      closeModal();
    }
  </script>
</body>
</html>
