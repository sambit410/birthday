<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! 🎉</title>

  <!-- Confetti library for visual effect -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 30px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .cake {
      font-size: 5rem;
      cursor: pointer;
      user-select: none;
      margin-bottom: 15px;
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .cake:hover {
      transform: scale(1.1);
    }

    h1 {
      font-size: 2.2rem;
      color: #ffee00;
      margin-bottom: 15px;
      line-height: 1.3;
    }

    .wish {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 25px;
    }

    .edit-section {
      margin-top: 25px;
      border-top: 1px dashed rgba(255, 255, 255, 0.2);
      padding-top: 20px;
      text-align: left;
    }

    .edit-section h3 {
      font-size: 1rem;
      color: #ffee00;
      margin-bottom: 12px;
      text-align: center;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: #cbd5e1;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ff3366;
      color: #fff;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button.wa {
      background: #25D366;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Clickable Cake for Confetti -->
    <div class="cake" onclick="triggerConfetti()" title="Click me!">🎂</div>

    <!-- Birthday Wish Display -->
    <h1>Happy Birthday, <br><span id="displayName">Alex</span>! 🎉</h1>
    <p class="wish" id="displayWish">Wishing you a fantastic day filled with joy, laughter, and happiness!</p>

    <!-- Customize Controls -->
    <div class="edit-section">
      <h3>✏️ Change Name & Message</h3>
      
      <label for="inputName">Birthday Person's Name:</label>
      <input type="text" id="inputName" placeholder="Enter name">

      <label for="inputWish">Wish Message:</label>
      <textarea id="inputWish" rows="3" placeholder="Enter custom wish message"></textarea>

      <button onclick="copyCustomLink()">📋 Copy Share Link</button>
      <button class="wa" onclick="shareWhatsApp()">💬 Share on WhatsApp</button>
    </div>
  </div>

  <script>
    // Read URL parameters on load
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name') || 'Alex';
      const wish = params.get('wish') || 'Wishing you a fantastic day filled with joy, laughter, and happiness!';

      document.getElementById('displayName').innerText = name;
      document.getElementById('displayWish').innerText = wish;

      document.getElementById('inputName').value = name;
      document.getElementById('inputWish').value = wish;
    });

    // Helper: Build the shareable URL
    function getShareUrl() {
      const name = document.getElementById('inputName').value.trim() || 'Friend';
      const wish = document.getElementById('inputWish').value.trim() || 'Happy Birthday!';

      // Live update on screen
      document.getElementById('displayName').innerText = name;
      document.getElementById('displayWish').innerText = wish;

      const baseUrl = window.location.origin + window.location.pathname;
      return `${baseUrl}?name=${encodeURIComponent(name)}&wish=${encodeURIComponent(wish)}`;
    }

    function copyCustomLink() {
      const link = getShareUrl();
      navigator.clipboard.writeText(link).then(() => {
        alert('Custom link copied! Send it to the birthday person.');
      }).catch(() => {
        prompt('Copy this link:', link);
      });
    }

    function shareWhatsApp() {
      const link = getShareUrl();
      const name = document.getElementById('inputName').value.trim() || 'Friend';
      const text = `🎉 Happy Birthday ${name}! Open your birthday card here: 👇\n${link}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
      }
    }
  </script>
</body>
</html>
